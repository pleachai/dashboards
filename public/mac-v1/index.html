<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleach Workforce — Mac v1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;background:#0b0d10;color:#e7ecf2;padding:22px 28px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap}
.head h1{font-size:20px;font-weight:700}.head h1 b{color:#7c8cff}
.tabs{display:flex;gap:6px;margin-left:8px}
.tabbtn{font:inherit;font-size:12.5px;font-weight:600;color:#9aa7bd;background:#12161c;border:1px solid #1f2630;border-radius:9px;padding:6px 13px;cursor:pointer}
.tabbtn.on{color:#fff;background:#1d2530;border-color:#33405200}
.meta-r{margin-left:auto;font-size:11px;color:#6f7a8b;text-align:right;line-height:1.5}
.meta-r .badge{color:#5ee6a8}
.tabpane{display:none}.tabpane.on{display:block}
/* board */
.bmeta,.lmeta{font-size:12px;color:#8893a4;margin-bottom:12px}.bmeta b,.lmeta b{color:#cdd6e4}
.boardgrid{display:grid;grid-template-columns:1.05fr 1.05fr .55fr;gap:14px}
.col{background:#12161c;border:1px solid #1f2630;border-radius:14px;padding:13px 13px 8px}
.col header{display:flex;align-items:center;gap:8px}.col h2{font-size:15px;font-weight:700}
.col .cnt{margin-left:auto;font-size:11.5px;font-weight:700;background:#1f2630;color:#cdd6e4;border-radius:999px;padding:2px 9px}
.col .sub{font-size:11px;color:#8893a4;margin:1px 0 9px}
.col.alpha{border-top:3px solid #ff8a5c}.col.beta{border-top:3px solid #6ad0ff}.col.launch{border-top:3px solid #5ee6a8}
.col ul{list-style:none;display:flex;flex-direction:column;gap:5px}.col.beta ul{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.it{display:flex;align-items:center;gap:6px;font-size:12px;background:#0e1217;border:1px solid #1b212b;border-radius:7px;padding:4px 7px}
.pt{font-weight:700;color:#0b0d10;background:#7c8cff;border-radius:5px;min-width:18px;text-align:center;font-size:11px}
.id{font-weight:700;color:#9aa7bd;white-space:nowrap}.ti{flex:1;color:#dfe6f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:#8893a4;background:#1a2029;border-radius:5px;padding:1px 5px;white-space:nowrap}
.parked{margin-top:14px;background:#0f1216;border:1px dashed #2a3140;border-radius:12px;padding:9px 13px;display:flex;align-items:center;gap:14px}
.parked h3{font-size:12px;color:#8893a4;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}.parked .pl{display:flex;flex-wrap:wrap;gap:6px}.parked .it{background:transparent}
/* charts */
.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#12161c;border:1px solid #1f2630;border-radius:14px;padding:12px 14px}
.card.narrow{max-width:320px}
.card h3{font-size:13px;margin-bottom:6px}.card h3 small{color:#8893a4;font-weight:400}
.legend{display:flex;gap:14px;margin-top:8px;font-size:11.5px}.legend span{display:flex;align-items:center;gap:6px;color:#cdd6e4}.sw{width:14px;height:4px;border-radius:2px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:12.5px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #1b212b}th{color:#8893a4;font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.ph{font-weight:700}
.kpi{display:flex;gap:10px;margin-top:12px}.kpi div{flex:1;background:#0e1217;border:1px solid #1b212b;border-radius:10px;padding:9px}.kpi b{font-size:19px;color:#fff;display:block}.kpi small{color:#8893a4;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
.note{font-size:11px;color:#6f7a8b;margin-top:12px;line-height:1.5}
.verdict{margin-top:16px;background:#15110f;border:1px solid #3a2a1c;border-radius:12px;padding:12px 16px;font-size:13px}.verdict b{color:#ffd166}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.opt{background:#0e1217;border:1px solid #1b212b;border-radius:10px;padding:11px 12px}.opt h4{font-size:12.5px;margin-bottom:4px;color:#fff}.opt p{font-size:11.5px;color:#9aa7bd;line-height:1.5}.opt .land{color:#5ee6a8;font-weight:700}
</style>
</head>
<body>
<div class="head">
  <h1><b>Pleach</b> Workforce — Mac v1</h1>
  <div class="tabs">
    <button class="tabbtn on" data-t="board">Board</button>
    <button class="tabbtn" data-t="capacity">Burndown</button>
    <button class="tabbtn" data-t="launch">Launch · Jul 1</button>
  </div>
  <div class="meta-r"><div class="badge" id="src">…</div><div id="updated"></div></div>
</div>
<div id="tab-board" class="tabpane on">Loading…</div>
<div id="tab-capacity" class="tabpane"></div>
<div id="tab-launch" class="tabpane"></div>
<script src="./app.js"></script>
</body>
</html>
