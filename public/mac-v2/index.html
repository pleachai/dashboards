<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleach — Mac v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script>(function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.dataset.theme=t;window.toggleTheme=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n);var b=document.getElementById('themebtn');if(b)b.textContent=n==='light'?'☾':'☀';dispatchEvent(new Event('themechange'));};addEventListener('DOMContentLoaded',function(){var b=document.getElementById('themebtn');if(b){b.textContent=document.documentElement.dataset.theme==='light'?'☾':'☀';b.onclick=window.toggleTheme;}});})();</script>
</head>
<body>
<div class="head">
  <h1><span class="logo"></span><b>Pleach</b>&nbsp;<span class="dim">· Mac v2 runtime</span></h1>
  <div class="crumbs"><a href="../">All</a><a href="../launch/">Launch</a><a href="../mac-v1/">Mac v1</a><a class="on" href="./">Mac v2</a><a href="../gtm/">GTM</a><a href="../pleach-cloud/">Cloud</a></div>
  <div class="tabs">
    <button class="tabbtn on" data-t="board">Board</button>
    <button class="tabbtn" data-t="capacity">Burndown</button>
    <button class="tabbtn" data-t="modules">Modules</button>
    <button class="tabbtn" data-t="launch">Launch · Sep 1</button>
  </div>
  <div class="meta-r"><div id="src">…</div><div id="updated"></div></div>
  <button id="themebtn" class="themebtn" title="Toggle light/dark" aria-label="Toggle theme">☀</button>
</div>
<div id="summary"></div>
<div id="tab-board" class="tabpane on">Loading…</div>
<div id="tab-capacity" class="tabpane"></div>
<div id="tab-modules" class="tabpane"></div>
<div id="tab-launch" class="tabpane"></div>
<script src="./app.js"></script>
</body>
</html>
