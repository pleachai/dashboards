<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pleach Dashboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<script>(function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');document.documentElement.dataset.theme=t;window.toggleTheme=function(){var n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('theme',n);var b=document.getElementById('themebtn');if(b)b.textContent=n==='light'?'☾':'☀';};addEventListener('DOMContentLoaded',function(){var b=document.getElementById('themebtn');if(b){b.textContent=document.documentElement.dataset.theme==='light'?'☾':'☀';b.onclick=window.toggleTheme;}});})();</script>
</head>
<body>
<div class="head">
  <h1><span class="logo"></span><b>Pleach</b>&nbsp;Dashboards</h1>
  <div class="meta-r"><div id="src">…</div><div id="updated"></div></div>
  <button id="themebtn" class="themebtn" title="Toggle light/dark" aria-label="Toggle theme">☀</button>
</div>
<p class="subt" style="font-size:12.5px;color:var(--mut);margin-bottom:18px">Live portfolio across every Linear project. Projects with a dashboard are clickable.</p>
<div id="portfolio" class="portfolio">Loading…</div>
<p class="note" style="max-width:820px">Add a dashboard: new <code>dashboards/&lt;slug&gt;/</code> + a line in <code>lib/registry.js</code> + a <code>public/&lt;slug&gt;/</code> folder, and map its project id in <code>lib/linear.js</code> (PROJECT_SLUG).</p>
<script>
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
async function tryJSON(u){const r=await fetch(u,{cache:'no-store'});const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(_){}return{ok:r.ok,status:r.status,json:j};}
function row(p){
  const bar=`<div class="pbar"><i style="width:${p.pct}%"></i></div>`;
  const inner=`<div class="pname">${esc(p.name)}<span class="pstate">${esc(p.state)}</span></div>${bar}<div class="ppct">${p.pct}%</div><div class="pmeta">${p.done}/${p.total} done</div>${p.slug?'<span class="arr">→</span>':'<span class="nodash" title="no dashboard">·</span>'}`;
  return p.slug?`<a class="prow" href="./${p.slug}/">${inner}</a>`:`<div class="prow nolink">${inner}</div>`;
}
(async()=>{
  let d=await tryJSON('/.netlify/functions/data?d=portfolio');let mode='live';
  if(!(d.ok&&d.json&&d.json.projects)){d=await tryJSON('./portfolio.json');mode='snapshot';}
  const el=document.getElementById('portfolio');
  if(!(d.json&&d.json.projects)){el.innerHTML=`<div class="callout">Couldn't load portfolio (${esc(d.json&&d.json.error?d.json.error:'HTTP '+d.status)})</div>`;return;}
  document.getElementById('src').innerHTML=mode==='live'?'<i class="dot live"></i>live':'<i class="dot"></i>snapshot';
  document.getElementById('updated').textContent=d.json.generatedAt?new Date(d.json.generatedAt).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
  el.innerHTML=d.json.projects.map(row).join('');
})();
</script>
</body>
</html>
